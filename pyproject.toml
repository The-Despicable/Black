[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-black"
version = "3.1.0"
description = "Raphael Black Hat Harness v3.1 — Maximum attack power, maximum stealth. Zero Docker."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Raphael RedTeam" }]
license = { text = "MIT" }

[project.scripts]
raphael = "harness.black_hat_cli:main"
raphael-ma = "raphael.multiagent.cli:app"

[project.optional-dependencies]
# PIN POLICY: validated lower bound + upper bound at next major
# (next minor for 0.x). See root requirements.txt.
multiagent = ["typer>=0.12,<1", "rich>=13.7,<15", "textual>=1.0,<9", "pyyaml>=6.0,<7", "requests>=2.28,<3"]
dev = ["pytest>=8.0.0,<10", "pytest-asyncio>=0.23,<2", "black>=24,<26", "flake8>=7,<8", "mypy>=1.8,<2"]
research = ["cloakbrowser>=0.6.4", "playwright>=1.40.0,<2"]
kernel = ["pywin32>=306,<311", "wmi>=1.5,<2"]
c2 = ["aiohttp[speedups]>=3.9.0,<4", "cryptography>=41.0.0,<45"]
exploitation = ["capstone>=5,<6", "unicorn>=2,<3", "keystone-engine>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*", "harness.*", "cloak_service*", "raphael*", "raphael.*"]
