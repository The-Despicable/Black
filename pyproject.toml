[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-black"
version = "3.1.0"
description = "Raphael Black Hat Harness v3.1 — Maximum attack power, maximum stealth. Zero Docker."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Raphael RedTeam" }]
license = { text = "MIT" }

[project.scripts]
raphael = "harness.black_hat_cli:main"
raphael-ma = "raphael.multiagent.cli:app"

[project.optional-dependencies]
multiagent = ["typer>=0.12", "rich>=13.7", "pyyaml>=6.0", "requests>=2.28"]
dev = ["pytest", "pytest-asyncio", "black", "flake8", "mypy"]
research = ["cloakbrowser>=0.6.4", "playwright>=1.53"]
kernel = ["pywin32", "wmi"]
c2 = ["aiohttp[speedups]", "cryptography"]
exploitation = ["capstone", "unicorn", "keystone-engine"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*", "harness.*", "cloak_service*", "raphael*", "raphael.*"]
