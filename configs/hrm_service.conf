; Supervisord program template — HRM service.
;
; Portable by construction: no path here is tied to a particular machine.
; Supervisord expands %(ENV_X)s from its own environment, so export these
; before launching it (or set them in the [supervisord] environment stanza):
;
;   RAPHAEL_ROOT     checkout root containing src/          (required)
;   RAPHAEL_PYTHON   interpreter to run the module   (default: python3)
;   RAPHAEL_USER     service account            (default: current user)
;
; Example:
;   RAPHAEL_ROOT=/opt/raphael \
;   RAPHAEL_PYTHON=/opt/raphael/.venv/bin/python \
;   RAPHAEL_USER=raphael \
;     supervisord -c configs/supervisord.conf
;
; NOTE: `orchestrator.hrm_service` is NOT part of this checkout. This unit
; only applies when that module is supplied (e.g. from a separate HRM
; deployment tree). It is retained as a template, not as a runnable service
; definition for this repository.
;
; The module is imported as `orchestrator.hrm_service`, which requires
; $RAPHAEL_ROOT/src on PYTHONPATH; run from the checkout root as above.

[program:hrm-service]
command=%(ENV_RAPHAEL_PYTHON)s -m orchestrator.hrm_service --port 9501
directory=%(ENV_RAPHAEL_ROOT)s
user=%(ENV_RAPHAEL_USER)s
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/hrm_service.err.log
stdout_logfile=/var/log/hrm_service.out.log
environment=PYTHONUNBUFFERED=1,PYTHONPATH=%(ENV_RAPHAEL_ROOT)s/src
